[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aml-grounded-agent"
version = "0.1.0"
description = "Evidence-grounded synthetic AML analysis on Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore>=1.8.0",
    "botocore[crt]>=1.35.0",
    "openai[bedrock]>=2.46.0",
    "openai-agents>=0.18.2",
    "pydantic>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aml_grounded_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
